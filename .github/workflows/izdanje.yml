name: Izdanje (macOS, Windows, Linux, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Oznaka izdanja (npr. v0.0.1-alpha)"
        required: true
        default: "v0.0.1-alpha"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalacija ovisnosti i gradnja za Windows
        run: |
          bun install
          bunx tauri build --bundles nsis,msi
      - name: Prijenos Windows instalacije u izdanje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp target/release/list2cart.exe List2Cart_0.0.1_windows_x64.exe
          gh release upload "$TAG" \
            List2Cart_0.0.1_windows_x64.exe \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/msi/*.msi \
            --clobber

  desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GTK / WebKit2GTK ovisnosti
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Gradnja za Linux (.deb i binarna datoteka)
        run: |
          bun install
          bunx tauri build --bundles deb
      - name: Prijenos Linux paketa u izdanje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp target/release/list2cart List2Cart_0.0.1_linux_amd64
          gh release upload "$TAG" \
            List2Cart_0.0.1_linux_amd64 \
            target/release/bundle/deb/*.deb \
            --clobber

  mobile-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Instalacija Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Inicijalizacija i gradnja Android APK
        run: |
          bun install
          bunx tauri android init
          bunx tauri android build --apk true
      - name: Potpisivanje debug/alpha kljucem i prijenos APK u izdanje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" List2Cart_0.0.1_android.apk
          gh release upload "$TAG" List2Cart_0.0.1_android.apk --clobber

  mobile-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Inicijalizacija i gradnja iOS paketa (bez potpisa za Alfa testiranje)
        run: |
          bun install
          brew install xcodegen
          bunx tauri ios init
          cd src-tauri/gen/apple
          xcodebuild -project list2cart.xcodeproj -scheme list2cart_iOS -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build"
          cd build/Release-iphonesimulator
          mkdir -p Payload
          cp -R list2cart.app Payload/
          zip -r "$GITHUB_WORKSPACE/List2Cart_0.0.1_ios_unsigned.ipa" Payload
      - name: Prijenos iOS IPA u izdanje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" List2Cart_0.0.1_ios_unsigned.ipa --clobber
