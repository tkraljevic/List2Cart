name: Alpha buildovi (Windows, Linux, Android)

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/build-alpha-*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Ovisnosti i frontend testovi
        run: |
          bun install --frozen-lockfile
          bun test tools src/ui
      - name: Windows x64 instalacije
        run: bunx tauri build --bundles nsis,msi --ci
      - uses: actions/upload-artifact@v4
        with:
          name: List2Cart-0.0.2-alpha-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    # Packaging-only retry: keep the already built Linux and Android artifacts.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: GTK i WebKit ovisnosti
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Ovisnosti i frontend testovi
        run: |
          bun install --frozen-lockfile
          bun test tools src/ui
      - name: Linux x64 paketi
        run: bunx tauri build --bundles deb,appimage --ci
      - uses: actions/upload-artifact@v4
        with:
          name: List2Cart-0.0.2-alpha-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android:
    # Packaging-only retry: keep the already built Linux and Android artifacts.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Android alati
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.0.12077973' 'platforms;android-35' 'build-tools;35.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Android arm64 APK
        run: |
          bun install --frozen-lockfile
          bun test tools src/ui
          bunx tauri android init --ci --skip-targets-install
          bunx tauri android build --apk --target aarch64 --ci
      - name: Testni potpis i provjera APK-a
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' -type f | sort | head -n 1)
          test -n "$APK"
          mkdir -p alpha-artifacts
          keytool -genkeypair -keystore "$RUNNER_TEMP/alpha.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=List2Cart Alpha,O=Development,C=HR'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/alpha.keystore" --ks-pass pass:android --key-pass pass:android --out alpha-artifacts/List2Cart_0.0.2-alpha_android_arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose alpha-artifacts/List2Cart_0.0.2-alpha_android_arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: List2Cart-0.0.2-alpha-android-arm64
          if-no-files-found: error
          retention-days: 14
          path: alpha-artifacts/*.apk
