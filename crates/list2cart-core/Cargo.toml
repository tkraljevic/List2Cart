[package]
name = "list2cart-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
encoding_rs = "0.8"
hex = "0.4"
syncnet = { version = "0.0.1", git = "https://github.com/tkraljevic/syncnet", rev = "a2aaba1768e9f14c91cd2fc08b7e8d6a4b20526c" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rust_xlsxwriter = "0.102"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
