[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
  # Tranzitivna ovisnost kroz Tauri Linux gtk3-macros (nema utjecaja na runtime).
  "RUSTSEC-2024-0370",
  # Informativna obavijest za chrono (koristi se samo za RFC3339 vremenske oznake).
  "RUSTSEC-2026-0543",
]

[licenses]
allow = [
  "EUPL-1.2",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tkraljevic/syncnet"]
